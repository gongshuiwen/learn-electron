name: Check

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:boundaries
      - run: npm test --workspace @learn-electron/model-connections
      - run: npm test --workspace @learn-electron/chatgpt-auth
      - run: npm run test:contracts
      - run: npm run test:server
      - run: npm run test:runtime
      - name: Prepare Linux sandbox
        if: runner.os == 'Linux'
        run: |
          npx --no-install install-electron
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Desktop smoke and integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Desktop smoke and integration tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Web browser test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:web
