Conversation:
  type: object
  required: [id, title, createdAt, updatedAt]
  properties:
    id: { type: string }
    title: { type: string }
    createdAt: { type: string }
    updatedAt: { type: string }
    selection: { $ref: 'models.yaml#/ModelRef' }
    binding: { $ref: 'models.yaml#/ModelBinding' }
Conversations:
  type: array
  items: { $ref: '#/Conversation' }
Message:
  type: object
  required: [id, role, content, createdAt, status]
  properties:
    id: { type: string }
    role: { type: string, enum: [user, assistant] }
    content: { type: string }
    createdAt: { type: string }
    status: { type: string, enum: [streaming, complete, interrupted] }
RunStatus:
  type: string
  enum: [running, cancelling, completed, cancelled, failed, interrupted]
Run:
  type: object
  required: [id, conversationId, status, createdAt, updatedAt]
  properties:
    id: { type: string }
    conversationId: { type: string }
    status: { $ref: '#/RunStatus' }
    createdAt: { type: string }
    updatedAt: { type: string }
    error: { type: string }
    errorCode: { type: string }
    target: { $ref: 'models.yaml#/ModelRef' }
Sequence:
  type: integer
  minimum: 0
  maximum: 9007199254740991
ConversationSnapshot:
  type: object
  required: [conversation, messages, run, sequence]
  description: run 非空时 conversationId 必须等于 conversation.id；由语义校验检查
  properties:
    conversation: { $ref: '#/Conversation' }
    messages:
      type: array
      items: { $ref: '#/Message' }
    run:
      anyOf:
        - { $ref: '#/Run' }
        - { type: 'null' }
    sequence: { $ref: '#/Sequence' }
    model: { $ref: 'models.yaml#/ModelStatus' }
RunEvent:
  allOf:
    - type: object
      required: [apiVersion, conversationId, runId, sequence]
      properties:
        apiVersion: { $ref: 'common.yaml#/ApiVersion' }
        conversationId: { type: string }
        runId: { type: string }
        sequence: { $ref: '#/Sequence' }
    - oneOf:
        - type: object
          required: [type, snapshot]
          properties:
            type: { type: string, const: snapshot }
            snapshot: { $ref: '#/ConversationSnapshot' }
        - type: object
          required: [type, messageId, delta]
          properties:
            type: { type: string, const: message.delta }
            messageId: { type: string }
            delta: { type: string }
        - type: object
          required: [type, message]
          properties:
            type: { type: string, const: message.completed }
            message: { $ref: '#/Message' }
        - type: object
          required: [type, run]
          properties:
            type: { type: string, const: run.updated }
            run: { $ref: '#/Run' }
  description: |
    snapshot 的会话和 sequence 必须与外层一致；其 run 可为会话的较新任务。
    run.updated 的 run.id 和 conversationId 必须与外层一致。由语义校验检查。
StartRunRequest:
  type: object
  required: [message, requestId]
  properties:
    message:
      type: string
      pattern: '\S'
      x-utf16-maxLength: 32000
      description: 原始 UTF-16 长度最多 32000；保存和幂等比较前 trim
    requestId:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,128}$'
    expectedTarget: { $ref: 'models.yaml#/ModelRef' }
RenameConversationRequest:
  type: object
  required: [title]
  properties:
    title:
      type: string
      pattern: '\S'
      x-trimmed-utf16-maxLength: 100
      description: trim 后 UTF-16 长度为 1–100
CreateConversationRequest:
  type: object
  properties:
    selection: { $ref: 'models.yaml#/ModelRef' }
